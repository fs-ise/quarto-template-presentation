_subdirectory: copier-template
_answers_file: .copier-answers.yml
_min_copier_version: "9.2.0"
_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions/paper_metadata.py:PaperMetadata
_skip_if_exists:
  - presentation.qmd
_tasks:
  - command: quarto add {{ extension_source }} --no-prompt
  - command: quarto add jmbuhr/quarto-qrcode --no-prompt
  - command: quarto add mcanouil/quarto-iconify --no-prompt
  - command: >-
      if git rev-parse --show-toplevel >/dev/null 2>&1; then
        printf '%s\n' "An enclosing Git repository already exists; skipping Git initialization, staging, and commit.";
      else
        git init && git add -A &&
        if git var GIT_AUTHOR_IDENT >/dev/null 2>&1 && git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
          git commit -m "Initial commit";
        else
          printf '%s\n' "Git repository initialized and files staged, but no Git identity is configured. Set user.name and user.email, then run: git commit -m \"Initial commit\"";
        fi
      fi
_message_after_copy: |
  {{ '\033[1;32m' }}✓ Presentation "{{ presentation_title }}" created successfully!{{ '\033[0m' }}

  {{ '\033[1;34m' }}Next steps:{{ '\033[0m' }}

    cd "{{ _copier_conf.dst_path }}"
    quarto preview presentation.qmd

  A Git repository is initialized and committed when no enclosing repository exists and Git has a configured identity. In an existing repository, generated files are left unstaged and uncommitted.

  Additional commands:

    quarto render
    quarto update extension --all

project_name:
  type: str
  help: Name of the Quarto project
  default: "{{ paper_title | default('Presentation title', true) }}"

presentation_title:
  type: str
  help: Title shown on the presentation
  default: "{{ project_name }}"

author:
  type: str
  help: Presentation author
  default: "{{ paper_author | default('Presenter Name', true) }}"

subtitle:
  type: str
  help: Optional presentation subtitle (leave blank to omit)
  default: ""

# Tests override this with the checkout path, ensuring that generated projects
# exercise the proposed revision. It is hidden from the interactive prompt so
# normal copy/update behaviour continues to use the public repository.
extension_source:
  type: str
  default: fs-ise/quarto-template-presentation
  when: false
