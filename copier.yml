_subdirectory: copier-template
_answers_file: .copier-answers.yml
_skip_if_exists:
  - presentation.qmd
_tasks:
  - command: >-
      cd "{{ _copier_conf.dst_path }}" &&
      quarto add fs-ise/quarto-template-presentation --no-prompt &&
      quarto add martinomagnifico/quarto-simplemenu --no-prompt &&
      quarto add jmbuhr/quarto-qrcode --no-prompt &&
      quarto add mcanouil/quarto-iconify --no-prompt
    when: "{{ _copier_operation == 'copy' }}"
_message_after_copy: |
  {{ '\033[1;32m' }}✓ Presentation "{{ presentation_title }}" created successfully!{{ '\033[0m' }}

  {{ '\033[1;34m' }}Next steps:{{ '\033[0m' }}

    cd "{{ _copier_conf.dst_path }}"
    quarto preview presentation.qmd

  Additional commands:

    quarto render
    quarto update extension --all

project_name:
  type: str
  help: Name of the Quarto project
  default: My presentation

presentation_title:
  type: str
  help: Title shown on the presentation
  default: "{{ project_name }}"

author:
  type: str
  help: Presentation author
  default: Your Name

subtitle:
  type: str
  help: Optional presentation subtitle (leave blank to omit)
  default: ""
