title: Simplemenu
author: Martin Donath
version: 2.0.0
quarto-required: ">=1.2.0"
contributes:
  revealjs-plugins:
    - name: Simplemenu
      script:
        - simplemenu.js
      stylesheet:
        - simplemenu.css
      config:
        simplemenu:
          barhtml:
            header: ""
            footer: "<div class='menubar'><ul class='menu'></ul><div class='slide-number'></div></div>"
          scale: 0.67
