title: Simplemenu
author: Martin Donath
version: 2.0.0
quarto-required: ">=1.2.0"
contributes:
  revealjs-plugins:
    - name: Simplemenu
      script:
        - simplemenu.js
      stylesheet:
        - simplemenu.css
      config:
        simplemenu:
          barhtml:
            header: ""
            footer: "<nav class='menubar' aria-label='Presentation sections'><ul class='menu'></ul><span class='menu-slide-number' aria-label='Slide number'></span></nav>"
          scale: 0.7
