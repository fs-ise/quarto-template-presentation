<section
  id="$idprefix$title-slide"
  class="quarto-title-block fs-cover"
  data-state="fs-cover-active"
  data-background-image="$if(cover-image)$$cover-image$$else$figures/title_background.png$endif$"
  data-background-size="cover"
  data-background-position="center"
  data-background-repeat="no-repeat"
>
  <img
    class="fs-cover-logo"
    src="figures/fs_logo_blue.svg"
    alt="Frankfurt School Logo"
  />
  <div class="fs-cover-details">
    $if(title)$<h1 class="title">$title$</h1>$endif$
    $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
    $if(by-author)$
    <div class="authors">
      $for(by-author)$
      <p class="author"><strong class="author-name">$by-author.name.literal$</strong>$if(by-author.affiliations)$, <span class="affiliation">$for(by-author.affiliations)$$it.name$$sep$, $endfor$</span>$endif$</p>
      $endfor$
    </div>
    $endif$
    $if(date)$<p class="date">$date$</p>$endif$
  </div>
</section>
