title: fs-ise-presentation
author: Gerit Wagner
version: 1.0.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    revealjs:
      theme: [simple,custom.scss]
      include-before-body: header.html
      template-partials:
        - title-slide.html
      width: 1600
      height: 900
      lazy-load: true
      # Simplemenu renders the single slide counter in the navigation bar.
      slide-number: false
      section-divs: true
      auto-stretch: false
      slide-level: 2
      revealjs-plugins:
        - simplemenu
      format-resources:
        # Quarto copies an individually listed extension resource by basename.
        # Listing the directory preserves `figures/` in the project and output.
        - figures
