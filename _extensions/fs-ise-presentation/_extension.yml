title: fs-ise-presentation
author: Gerit Wagner
version: 1.0.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    revealjs:
      theme: [simple,custom.scss]
      include-before-body: header.html
      template-partials:
        - title-slide.html
      width: 1600
      height: 900
      lazy-load: true
      # Simplemenu relocates Reveal's native current/total slide counter.
      slide-number: c/t
      # Flat Simplemenu sections are content slides, not nested section divs.
      section-divs: false
      auto-stretch: false
      slide-level: 2
      revealjs-plugins:
        - simplemenu
      simplemenu:
        flat: true
        scale: 0.7
        # Do not inject a second copy of the stylesheet; Quarto includes the
        # upstream stylesheet from the embedded plugin manifest.
        csspath: false
        barhtml:
          header: ""
          footer: "<nav class='menubar' aria-label='Presentation sections'><ul class='menu'></ul><div class='slide-number'></div></nav>"
      format-resources:
        # Quarto copies an individually listed extension resource by basename.
        # Listing the directory preserves `figures/` in the project and output.
        - figures
