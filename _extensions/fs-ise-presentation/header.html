<header id="fs-header" aria-hidden="true">
  <img src="figures/fs_logo_blue_content.svg" alt="" />
</header>
<script>
  (() => {
    const coverClass = "fs-cover-visible";
    const logo = document.getElementById("fs-header");
    const logicalLogoWidth = 152.6;
    let logoMounted = false;

    const sizeLogo = () => {
      const scale = window.Reveal?.getScale?.();
      if (Number.isFinite(scale) && scale > 0) {
        logo.style.width = `${logicalLogoWidth * scale}px`;
      }
    };

    const syncCoverState = (event) => {
      const currentSlide = event?.currentSlide || window.Reveal?.getCurrentSlide();
      document.documentElement.classList.toggle(
        coverClass,
        Boolean(currentSlide?.classList.contains("fs-cover"))
      );
    };

    const initializeLogo = (event) => {
      if (!logoMounted) {
        const revealRoot = document.querySelector(".reveal");
        if (revealRoot) {
          revealRoot.appendChild(logo);
          logoMounted = true;
        }
      }
      sizeLogo();
      syncCoverState(event);
    };

    const bindReveal = () => {
      if (!window.Reveal?.on) {
        window.setTimeout(bindReveal, 25);
        return;
      }

      Reveal.on("ready", initializeLogo);
      Reveal.on("slidechanged", syncCoverState);
      Reveal.on("resize", sizeLogo);
      window.addEventListener("resize", () => requestAnimationFrame(sizeLogo));
      if (Reveal.isReady?.()) {
        initializeLogo();
      } else {
        syncCoverState();
      }
    };

    bindReveal();
  })();
</script>
