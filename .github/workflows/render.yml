name: Render presentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.0"

      - name: Render example presentation
        run: quarto render template.qmd --to fs-ise-presentation-revealjs

      - name: Verify rendered output
        run: test -f template.html
