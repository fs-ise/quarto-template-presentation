name: Render presentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.0"

      - name: Install Simplemenu
        run: quarto add martinomagnifico/quarto-simplemenu --no-prompt

      - name: Render example presentation from the project root
        run: quarto render

      - name: Verify rendered output
        run: |
          set -euo pipefail
          test -f template.html
          grep -q 'class="fs-cover-logo"' template.html
          grep -q -- '--fs-logo-width: 220px' template.html
          grep -q 'left: var(--fs-edge-inset)' template.html
          test "$(grep -c 'src="figures/fs_logo_blue.svg"' template.html)" -eq 2
          grep -qi 'simplemenu' template.html
          grep -q 'class="menubar"' template.html
          for group in Introduction Formatting Examples; do
            grep -q "data-name=.$group." template.html
          done
          test -f figures/fs_logo_blue.svg
          test -f figures/title_background.png
          test -d template_files
          find template_files -type f -name 'reveal.js' -print -quit | grep -q .
          find template_files -type f -name '*.css' -print -quit | grep -q .
          find template_files -type f -name '*.js' -print -quit | grep -q .

      - name: Verify direct document rendering
        run: quarto render template.qmd

      - name: Assemble downloadable presentation
        run: |
          set -euo pipefail
          distribution=presentation-html
          rm -rf "$distribution"
          mkdir "$distribution"
          cp template.html "$distribution/"
          cp -a template_files figures "$distribution/"

          # Ensure every local resource referenced directly by the HTML was
          # included. Remote URLs, anchors, and inline data URLs need no file.
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path("presentation-html")

          class Resources(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = set()

              def handle_starttag(self, _tag, attrs):
                  values = dict(attrs)
                  for name in ("src", "href", "data-background-image"):
                      value = values.get(name, "")
                      parsed = urlsplit(value)
                      if value and not parsed.scheme and not parsed.netloc and not value.startswith(("#", "//")):
                          self.paths.add(unquote(parsed.path))

          parser = Resources()
          parser.feed((root / "template.html").read_text(encoding="utf-8"))
          missing = sorted(path for path in parser.paths if path and not (root / path).is_file())
          if missing:
              raise SystemExit("Missing local HTML resources: " + ", ".join(missing))
          PY

      - name: Upload presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-html
          path: presentation-html/
          if-no-files-found: error

  generation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Copier
        run: python -m pip install copier

      - name: Generate and render a Copier project
        run: tests/copier/smoke.sh

      - name: Verify the Quarto template excludes Copier files
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d)
          cd "$output"
          quarto use template "$GITHUB_WORKSPACE" --no-prompt
          quarto add martinomagnifico/quarto-simplemenu --no-prompt
          test -f template.qmd
          test -d _extensions/fs-ise-presentation
          test -f _extensions/fs-ise-presentation/figures/title_background.png
          test ! -e _quarto.yml
          test ! -e copier.yml
          test ! -e copier-template
          test ! -e tests/copier
          quarto render template.qmd
          test -f template.html
          test -f figures/fs_logo_blue.svg
          test -f figures/title_background.png
          test ! -e fs_logo_blue.svg
          test ! -e title_background.png
          grep -q 'data-background-image="figures/title_background.png"' template.html
          grep -q 'src="figures/fs_logo_blue.svg"' template.html
