name: Render presentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Run static tests
        run: make test-static

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Run installation and browser tests
        run: |
          make test-install
          make test-browser
        env:
          KEEP_TEST_PROJECTS: "1"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            .test-artifacts/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  copier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Generate and render a Copier project
        run: make test-copier
        env:
          KEEP_TEST_PROJECTS: "1"
      - name: Upload Copier failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: copier-test-diagnostics
          path: |
            .test-artifacts/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  render:
    needs: static-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.0"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      # This intentionally renders the checked-in example directly; publishing
      # must not depend on Copier generation or its network-installed extras.
      - name: Render canonical example presentation
        run: quarto render template.qmd

      - name: Generate title-slide preview
        run: |
          uv sync
          uv run playwright install chromium
          uv run python scripts/generate-preview.py template.html preview.png

      - name: Assemble downloadable presentation
        run: |
          distribution=presentation-html
          rm -rf "$distribution"
          mkdir "$distribution"
          cp template.html "$distribution/"
          cp template.html "$distribution/index.html"
          cp preview.png "$distribution/"
          cp -a template_files figures "$distribution/"
          test -f "$distribution/index.html"

          # Validate the exact preview that will be downloadable and deployed.
          uv run python scripts/generate-preview.py --validate-only template.html "$distribution/preview.png"

          # Ensure every local resource referenced directly by the HTML was
          # included. Remote URLs, anchors, and inline data URLs need no file.
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path("presentation-html")

          class Resources(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = set()

              def handle_starttag(self, _tag, attrs):
                  values = dict(attrs)
                  for name in ("src", "href", "data-background-image"):
                      value = values.get(name, "")
                      parsed = urlsplit(value)
                      if value and not parsed.scheme and not parsed.netloc and not value.startswith(("#", "//")):
                          self.paths.add(unquote(parsed.path))

          parser = Resources()
          parser.feed((root / "template.html").read_text(encoding="utf-8"))
          missing = sorted(path for path in parser.paths if path and not (root / path).is_file())
          if missing:
              raise SystemExit("Missing local HTML resources: " + ", ".join(missing))
          PY

          # Check image-specific attributes (including Reveal background and
          # lazy-loading attributes) against the exact Pages artifact.
          python tests/check-published-images.py "$distribution"

      - name: Upload presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-html
          path: presentation-html/
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation-html/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [render, integration-tests, copier-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Publish example presentation
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify images and preview on GitHub Pages
        run: |
          python tests/check-published-images.py "${{ steps.deployment.outputs.page_url }}"
          preview_url="${{ steps.deployment.outputs.page_url }}preview.png"
          curl --fail --location --retry 5 --retry-all-errors --output deployed-preview.png "$preview_url"
          python - <<'PY'
          import struct
          from pathlib import Path

          path = Path("deployed-preview.png")
          header = path.read_bytes()[:24]
          if len(header) != 24 or header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
              raise SystemExit("Deployed /preview.png is not a valid PNG")
          dimensions = struct.unpack(">II", header[16:24])
          if dimensions != (1600, 900):
              raise SystemExit(f"Deployed /preview.png is {dimensions[0]}x{dimensions[1]}, expected 1600x900")
          print("Deployed /preview.png is accessible and valid (1600x900)")
          PY
