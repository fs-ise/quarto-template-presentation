name: Render presentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.0"

      - name: Render canonical example presentation
        run: quarto render template.qmd

      - name: Verify rendered output
        run: |
          source tests/lib/assert.sh
          require_file template.html
          require_presentation_style . template.html
          for group in Introduction Formatting Examples; do
            require_html_attribute_count template.html section data-name "$group" 1
          done
          require_dir template_files
          require_html_resource template.html 'reveal[^/]*\.js$'
          require_html_resource template.html 'reveal[^/]*\.css$'

      - name: Assemble downloadable presentation
        run: |
          source tests/lib/assert.sh
          distribution=presentation-html
          rm -rf "$distribution"
          mkdir "$distribution"
          cp template.html "$distribution/"
          cp template.html "$distribution/index.html"
          cp -a template_files figures "$distribution/"
          require_file "$distribution/index.html"

          # Ensure every local resource referenced directly by the HTML was
          # included. Remote URLs, anchors, and inline data URLs need no file.
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path("presentation-html")

          class Resources(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = set()

              def handle_starttag(self, _tag, attrs):
                  values = dict(attrs)
                  for name in ("src", "href", "data-background-image"):
                      value = values.get(name, "")
                      parsed = urlsplit(value)
                      if value and not parsed.scheme and not parsed.netloc and not value.startswith(("#", "//")):
                          self.paths.add(unquote(parsed.path))

          parser = Resources()
          parser.feed((root / "template.html").read_text(encoding="utf-8"))
          missing = sorted(path for path in parser.paths if path and not (root / path).is_file())
          if missing:
              raise SystemExit("Missing local HTML resources: " + ", ".join(missing))
          PY

      - name: Upload presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-html
          path: presentation-html/
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation-html/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish example presentation
        id: deployment
        uses: actions/deploy-pages@v4

  generation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Copier
        run: python -m pip install copier

      - name: Test clean Quarto add and use-template installations
        run: tests/install/smoke.sh

      - name: Generate and render a Copier project
        run: tests/copier/smoke.sh
